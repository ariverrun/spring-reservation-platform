services:
  reservation-app:
    build:
      context: ./reservation
      dockerfile: Dockerfile
    container_name: reservation-app
    # ports:
    #   - "${RESERVATION_APP_PORT}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./ssh-keys:/app/ssh-keys:ro 
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services-network

  auth-app:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: auth-app
    # ports:
    #   - "${AUTH_APP_PORT}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./ssh-keys:/app/ssh-keys:ro    
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services-network

  gateway-app:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway-app
    ports:
      - "${GATEWAY_APP_PORT}:8010"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - RESERVATION_HOST=${RESERVATION_HOST}
      - RESERVATION_PORT=${RESERVATION_PORT}
      - AUTH_HOST=${AUTH_HOST}
      - AUTH_PORT=${AUTH_PORT}
    depends_on:
      reservation-app:
        condition: service_healthy
      auth-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8010/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services-network

networks:
  services-network:
    driver: bridge

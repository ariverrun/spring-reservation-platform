services:
  reservation-app:
    build:
      context: ./reservation
      dockerfile: Dockerfile
    container_name: reservation-app
    ports:
      - "${RESERVATION_APP_PORT}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services-network

  auth-app:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: auth-app
    ports:
      - "${AUTH_APP_PORT}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - services-network

networks:
  services-network:
    driver: bridge

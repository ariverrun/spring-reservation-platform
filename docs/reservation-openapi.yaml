components:
  schemas:
    RestApiValidationErrorDto:
      type: object
      properties:
        error:
          type: string
        violations:
          type: object
          additionalProperties:
            type: string
    RestApiErrorDto:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
    UpdateReservationRequestDto:
      required:
      - isCanceled
      - seats
      type: object
      properties:
        seats:
          minimum: 1
          type: integer
          format: int32
        isCanceled:
          type: boolean
    ReservationDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        seats:
          type: integer
          format: int32
        isCanceled:
          type: boolean
    UpdateEventRequestDto:
      required:
      - durationSeconds
      - isCanceled
      - name
      - startTime
      - ticketPrice
      - totalSeats
      type: object
      properties:
        name:
          maxLength: 255
          minLength: 0
          type: string
        description:
          maxLength: 2000
          minLength: 0
          type: string
        startTime:
          type: string
          format: date-time
        durationSeconds:
          minimum: 1
          type: integer
          format: int64
        ticketPrice:
          minimum: 0
          type: number
          format: double
        totalSeats:
          minimum: 1
          type: integer
          format: int32
        isCanceled:
          type: boolean
    EventDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        startTime:
          type: string
          format: date-time
        durationSeconds:
          type: integer
          format: int64
        ticketPrice:
          type: number
          format: double
        totalSeats:
          type: integer
          format: int32
        isCanceled:
          type: boolean
    CreateReservationRequestDto:
      required:
      - eventId
      - seats
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        seats:
          minimum: 1
          type: integer
          format: int32
    ReservationCreatedDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
    CreateEventRequestDto:
      required:
      - durationSeconds
      - name
      - startTime
      - ticketPrice
      - totalSeats
      type: object
      properties:
        name:
          maxLength: 255
          minLength: 0
          type: string
        description:
          maxLength: 2000
          minLength: 0
          type: string
        startTime:
          type: string
          format: date-time
        durationSeconds:
          minimum: 1
          type: integer
          format: int64
        ticketPrice:
          minimum: 0
          type: number
          format: double
        totalSeats:
          minimum: 1
          type: integer
          format: int32
    EventCreatedDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
    ReservationEventDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        startTime:
          type: string
          format: date-time
        durationSeconds:
          type: integer
          format: int64
        ticketPrice:
          type: number
          format: double
        isCanceled:
          type: boolean
    ReservationWithEventDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        event:
          $ref: '#/components/schemas/ReservationEventDto'
        seats:
          type: integer
          format: int32
        isCanceled:
          type: boolean
